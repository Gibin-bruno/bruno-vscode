name: nightly vsix build

on:
  workflow_dispatch:
    inputs:
      TAG_NAME:
        description: |-
          Tag name for the release
          (default: v{version}-{today})
        required: false
        default: ''
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
  schedule:
    - cron: '30 16 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      tag_name: ${{ steps.set_tag_name.outputs.TAG_NAME }}
      sha: ${{ steps.build_info.outputs.sha }}
      branch: ${{ steps.build_info.outputs.branch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Record build info
        id: build_info
        shell: bash
        env:
          BUILD_BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BUILD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "BUILD_BRANCH=$BUILD_BRANCH" >> "$GITHUB_ENV"
          echo "Building branch '$BUILD_BRANCH' at $SHA (trigger: $GITHUB_EVENT_NAME)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # make sure the package.json version is a valid semver and create a TAG_NAME variable (ex: v5.0.0-2025.04.11)
      - name: Validate version and create TAG_NAME var
        id: set_tag_name
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.TAG_NAME }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          INPUT_TAG_NAME=$(echo "$INPUT_TAG_NAME" | xargs)
          TODAY=$(date '+%Y.%m.%d')
          if [ -z "$INPUT_TAG_NAME" ]; then
            TAG_NAME="v${VERSION}-${TODAY}"
          else
            TAG_NAME="$INPUT_TAG_NAME"
          fi
          if ! git check-ref-format "refs/tags/$TAG_NAME"; then
            echo "::error title=Invalid tag name::'$TAG_NAME' is not a valid git tag name"
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Fetch dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Package VSIX
        shell: bash
        run: |
          npm run package

      - name: Rename VSIX with tag
        shell: bash
        run: |
          VSIX_FILE=$(ls *.vsix)
          EXTENSION_NAME=$(jq -r '.name' package.json)
          mv "$VSIX_FILE" "${EXTENSION_NAME}-${TAG_NAME}.vsix"
          echo "VSIX_NAME=${EXTENSION_NAME}-${TAG_NAME}.vsix" >> "$GITHUB_ENV"

      - name: Write build summary
        shell: bash
        run: |
          SHA="${{ steps.build_info.outputs.sha }}"
          {
            echo "## Nightly VSIX build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Branch** | \`$BUILD_BRANCH\` |"
            echo "| **Commit** | [\`${SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA) |"
            echo "| **Tag** | \`$TAG_NAME\` |"
            echo "| **Trigger** | $GITHUB_EVENT_NAME by @$GITHUB_ACTOR |"
            echo "| **VSIX** | \`$VSIX_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-build
          path: ./*.vsix
          retention-days: 1

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: ${{ needs.build.outputs.branch }}

    steps:
      - name: Check if tag_name is present
        shell: bash
        run: |
          if [ -z "${{ needs.build.outputs.tag_name }}" ]; then
            echo "TAG_NAME is not present"
            exit 1
          else
            echo "TAG_NAME is present: ${{ needs.build.outputs.tag_name }}"
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download VSIX build artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-build
          path: ./builds/vsix

      - name: Check if release with the same tag exists
        id: check_release
        shell: bash
        run: |
          TAG_NAME="${{ needs.build.outputs.tag_name }}"
          RELEASE_EXISTS=$(gh release view "$TAG_NAME" --json tagName --jq '.tagName' || echo "not_found")
          if [ "$RELEASE_EXISTS" != "not_found" ]; then
            echo "Release with tag $TAG_NAME already exists. Skipping creation of the tag."
            echo "release_exists=true" >> $GITHUB_ENV
          else
            echo "Release does not exist. It will be created."
            echo "release_exists=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release and Upload Artifacts
        if: ${{ env.release_exists == 'false' }}
        shell: bash
        run: |
          TAG_NAME="${{ needs.build.outputs.tag_name }}"
          SHA="${{ needs.build.outputs.sha }}"
          gh release create "$TAG_NAME" \
            ./builds/vsix/*.vsix \
            --target "$SHA" \
            --title "$TAG_NAME" \
            --notes "Nightly VSIX build for $TAG_NAME from branch \`$BUILD_BRANCH\` (commit $SHA)" \
            --prerelease

      - name: Replace Artifacts if Release Exists
        if: ${{ env.release_exists == 'true' }}
        shell: bash
        run: |
          TAG_NAME="${{ needs.build.outputs.tag_name }}"
          gh release upload "$TAG_NAME" \
            ./builds/vsix/*.vsix \
            --clobber

      - name: Write release summary
        shell: bash
        run: |
          TAG_NAME="${{ needs.build.outputs.tag_name }}"
          ACTION=$([ "${{ env.release_exists }}" = "true" ] && echo "updated (VSIX replaced)" || echo "created")
          echo "Release [\`$TAG_NAME\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME) $ACTION from branch \`$BUILD_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
