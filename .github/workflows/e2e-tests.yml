name: e2e tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'main'
  # TEMPORARY: lets the workflow run from this branch before it is on main. Remove before merging.
  push:
    branches:
      - tests/e2e_v2

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Fetch dependencies
        run: |
          npm install --legacy-peer-deps

      # VS Code is an Electron app: it needs these libraries, and Xvfb gives it a virtual display.
      - name: Install VS Code system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgtk-3-0 libxss1 libgbm1 libasound2t64

      # The specs launch the extension from dist/, so build it first.
      - name: Build extension
        run: |
          npm run build

      # Started once up front so parallel workers don't each try to start it.
      - name: Start Keycloak
        run: |
          npm run test:keycloak:up

      - name: Run e2e tests
        run: |
          xvfb-run -a npm run test:e2e

      - name: Stop Keycloak
        if: always()
        run: |
          npm run test:keycloak:down

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
